<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Daily Command Centre</title>
<meta name="theme-color" content="#0D1830">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>/* Layout: one centred column (max 640px). Home = date + three full-width buttons; sheets = sticky bar + hour rows (time | text | checkbox) + habits */
:root {
  --bg: #EEF1F6; --surface: #FFFFFF; --surface-2: #F5F7FA; --line: #DCE2EB; --line-2: #C6CFDC;
  --ink: #1C2230; --muted: #5A6679; --faint: #8F99A8;
  --navy: #0D1830; --navy-2: #182746; --on-navy: #FFFFFF; --navy-muted: #AAB6CC;
  --accent: #2557E6; --accent-h: #1C47C4; --accent-ink: #FFFFFF; --accent-soft: #E6EDFC;
  --ok: #1E8552; --ok-soft: #E3F2EA; --gold: #C8901E; --gold-soft: #FBF1DC; --warn: #A86A12;
  --scrim: rgba(9, 15, 30, .5);
  --font: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0A1120; --surface: #111A2C; --surface-2: #16203A; --line: #233049; --line-2: #33425F;
  --ink: #E6EBF3; --muted: #9CA8BC; --faint: #6D7A91;
  --navy: #16233F; --navy-2: #1E2E50; --on-navy: #FFFFFF; --navy-muted: #A3B0C8;
  --accent: #5C8BFF; --accent-h: #7AA0FF; --accent-ink: #081022; --accent-soft: #1A2A50;
  --ok: #3EBB7D; --ok-soft: #12301F; --gold: #E4B252; --gold-soft: #33280F; --warn: #E2A74B; --scrim: rgba(0, 0, 0, .65); color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0A1120; --surface: #111A2C; --surface-2: #16203A; --line: #233049; --line-2: #33425F;
  --ink: #E6EBF3; --muted: #9CA8BC; --faint: #6D7A91;
  --navy: #16233F; --navy-2: #1E2E50; --on-navy: #FFFFFF; --navy-muted: #A3B0C8;
  --accent: #5C8BFF; --accent-h: #7AA0FF; --accent-ink: #081022; --accent-soft: #1A2A50;
  --ok: #3EBB7D; --ok-soft: #12301F; --gold: #E4B252; --gold-soft: #33280F; --warn: #E2A74B; --scrim: rgba(0, 0, 0, .65); color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.45; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
button, input, select { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; }
button:disabled { cursor: not-allowed; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3, p { margin: 0; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

.app { max-width: 640px; margin: 0 auto; padding-inline: 16px; min-height: 100%; }

/* ---------- home ---------- */
.home { padding-block: 28px 32px; display: flex; flex-direction: column; gap: 22px; min-height: 100%; }
.eyebrow { font-size: 12.5px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.home-h h1 { font-size: 28px; font-weight: 700; letter-spacing: -.02em; line-height: 1.15; margin-top: 4px; text-wrap: balance; }
.big-btns { display: flex; flex-direction: column; gap: 14px; }
.big { display: flex; align-items: center; gap: 16px; width: 100%; min-height: 112px; padding: 20px; border-radius: 14px; text-align: left; background: var(--navy); color: var(--on-navy); transition: transform .1s, background .15s; }
.big:hover { background: var(--navy-2); }
.big:active { transform: scale(.99); }
.big > svg { flex: none; opacity: .7; }
.big-ic { position: relative; width: 56px; height: 56px; border-radius: 12px; display: grid; place-items: center; flex: none; background: rgba(255, 255, 255, .1); }
.b-personal .big-ic { background: var(--accent); color: #fff; }
.big-t { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.big-t b { font-size: 22px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
.big-t span { font-size: 14px; color: var(--navy-muted); }
.b-rewards { background: var(--surface); color: var(--ink); border: 1px solid var(--line); }
.b-rewards:hover { background: var(--surface-2); }
.b-rewards .big-ic { background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
.b-rewards .big-t span { color: var(--muted); }
.b-rewards.lit { background: var(--gold-soft); border: 2px solid var(--gold); box-shadow: 0 0 0 4px color-mix(in srgb, var(--gold) 22%, transparent), 0 8px 28px color-mix(in srgb, var(--gold) 30%, transparent); animation: glow 2.2s ease-in-out infinite; }
.b-rewards.lit .big-ic { background: var(--gold); color: #fff; border-color: transparent; }
.b-rewards.lit .big-t span { color: var(--ink); font-weight: 600; }
@keyframes glow { 50% { box-shadow: 0 0 0 8px color-mix(in srgb, var(--gold) 12%, transparent), 0 8px 34px color-mix(in srgb, var(--gold) 40%, transparent); } }
.dot { position: absolute; top: -6px; right: -6px; min-width: 22px; height: 22px; border-radius: 11px; background: #D93A2F; color: #fff; font-size: 12px; font-weight: 700; display: grid; place-items: center; padding: 0 6px; border: 2px solid var(--gold-soft); }
.home-f { margin-top: auto; text-align: center; }
.sync { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); }
.sync.warn { color: var(--warn); }

/* ---------- sheet pages ---------- */
.sheet-page { padding-block: 0 40px; display: flex; flex-direction: column; gap: 16px; }
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; display: flex; align-items: center; gap: 8px; padding: 10px 0; background: var(--bg); border-bottom: 1px solid var(--line); margin-inline: -16px; padding-inline: 8px 16px; }
.back { width: 48px; height: 48px; border-radius: 10px; display: grid; place-items: center; flex: none; color: var(--ink); }
.back:hover { background: var(--surface-2); }
.bar-t { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.bar-t h1 { font-size: 21px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; line-height: 1.2; }
.bar-t span { font-size: 13.5px; color: var(--muted); }
.bar-p { text-align: right; font-size: 20px; font-weight: 600; line-height: 1.1; display: flex; flex-direction: column; }
.bar-p small { font-family: var(--font); font-size: 11.5px; color: var(--muted); font-weight: 500; text-transform: uppercase; letter-spacing: .05em; }

.block { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.sec { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 14px 16px 10px; font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.sec .mono { font-weight: 500; letter-spacing: 0; text-transform: none; font-size: 12.5px; }
.sub { font-size: 12.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 14px 16px 6px; border-top: 1px solid var(--line); }

.rows { list-style: none; margin: 0; padding: 0; }
.row { display: flex; align-items: center; gap: 8px; min-height: 60px; padding: 6px 6px 6px 0; border-top: 1px solid var(--line); scroll-margin-top: 90px; }
.time { width: 82px; flex: none; padding-left: 16px; font-size: 13.5px; font-weight: 500; color: var(--ink); align-self: stretch; display: flex; align-items: center; }
.row.extra { min-height: 52px; border-top-style: dashed; }
.row.extra .time::before { content: ''; width: 10px; height: 10px; border-left: 2px solid var(--line-2); border-bottom: 2px solid var(--line-2); margin-left: 14px; border-radius: 0 0 0 3px; }
.row.now .time { color: var(--accent); font-weight: 700; box-shadow: inset 3px 0 0 var(--accent); }
.act { flex: 1; min-width: 0; height: 46px; border: 1px solid transparent; border-radius: 8px; background: var(--surface-2); padding: 0 12px; font-size: 16px; }
.act:hover { border-color: var(--line); }
.act:focus { outline: none; border-color: var(--accent); background: var(--surface); box-shadow: 0 0 0 3px var(--accent-soft); }
.act::placeholder { color: var(--faint); }
.row.done .act { background: var(--ok-soft); color: var(--muted); text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--ok) 60%, transparent); }
.del { width: 40px; height: 44px; display: grid; place-items: center; color: var(--faint); border-radius: 8px; flex: none; }
.del:hover { color: #D93A2F; background: var(--surface-2); }

.chk { width: 48px; height: 48px; display: grid; place-items: center; flex: none; }
.chk .box, .hab-b .box { width: 28px; height: 28px; border-radius: 8px; border: 2px solid var(--line-2); background: var(--surface); display: grid; place-items: center; color: #fff; transition: background .12s, border-color .12s; flex: none; }
.chk:hover .box { border-color: var(--ok); }
.chk.muted .box { opacity: .45; }
.chk.on .box, .hab li.done .box { background: var(--ok); border-color: var(--ok); }

.add { padding: 14px 16px 16px; border-top: 1px solid var(--line); background: var(--surface-2); display: flex; flex-direction: column; gap: 8px; }
.sec-s { font-size: 13px; font-weight: 600; }
.add-row { display: grid; grid-template-columns: 1fr auto 48px; gap: 8px; }
.add-row input, .add-row select { min-height: 48px; border: 1px solid var(--line-2); border-radius: 8px; background: var(--surface); padding: 0 12px; font-size: 16px; min-width: 0; }
.add-row select { padding-right: 6px; max-width: 128px; }
.add-row input:focus, .add-row select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.add-b { height: 48px; border-radius: 8px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; }
.add-b:disabled { opacity: .4; }
@media (max-width: 380px) { .add-row { grid-template-columns: 1fr 48px; } .add-row input { grid-column: 1 / -1; } .add-row select { max-width: none; } }

.habits .sec { color: var(--ink); }
.hab { list-style: none; margin: 0; padding: 0; }
.hab li { border-top: 1px solid var(--line); }
.hab-b { width: 100%; display: flex; align-items: center; gap: 14px; min-height: 58px; padding: 10px 16px; text-align: left; font-size: 16px; font-weight: 500; }
.hab-b:hover { background: var(--surface-2); }
.hab li.done .hab-b > span:last-child { color: var(--muted); text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--ok) 60%, transparent); }
.foot { font-size: 13px; color: var(--muted); padding: 0 4px; }

/* ---------- rewards ---------- */
.reward-card { background: var(--navy); color: var(--on-navy); border-radius: 14px; padding: 22px 20px; display: flex; flex-direction: column; gap: 8px; border: 2px solid var(--gold); }
.rc-eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--gold); }
.rc-h { font-size: 28px; font-weight: 700; letter-spacing: .02em; text-transform: uppercase; }
.rc-sub { color: var(--navy-muted); font-size: 14.5px; }
.rc-r { font-size: 18px; font-weight: 500; line-height: 1.4; margin: 6px 0 8px; }
.rc-r > span:first-child { display: block; font-size: 12.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--gold); }
.btn-primary { min-height: 50px; padding: 0 22px; border-radius: 10px; background: var(--accent); color: var(--accent-ink); font-weight: 600; font-size: 16px; }
.btn-primary:hover { background: var(--accent-h); }
.reward-card .btn-primary { align-self: flex-start; }
.btn-text { min-height: 48px; padding: 0 16px; color: var(--muted); font-weight: 500; }
.week { list-style: none; margin: 0; padding: 0; }
.wd { display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 6px 16px; border-top: 1px solid var(--line); }
.wd-d { width: 64px; display: flex; gap: 8px; align-items: baseline; } .wd-d b { font-weight: 600; width: 32px; } .wd-d .mono { color: var(--muted); font-size: 14px; }
.wd-i { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--line-2); display: grid; place-items: center; flex: none; }
.wd-ok .wd-i { background: var(--ok); border-color: var(--ok); color: #fff; }
.wd-today .wd-i { border-color: var(--accent); }
.wd-up .wd-i { border-style: dashed; }
.wd-l { font-size: 14px; color: var(--muted); } .wd-ok .wd-l { color: var(--ok); font-weight: 600; } .wd-today .wd-l { color: var(--accent); font-weight: 600; }
.note { padding: 12px 16px 16px; font-size: 14px; color: var(--muted); border-top: 1px solid var(--line); }
.claimed { list-style: none; margin: 0; padding: 0; }
.claimed li { display: flex; gap: 12px; padding: 12px 16px; border-top: 1px solid var(--line); align-items: flex-start; } .claimed svg { color: var(--gold); flex: none; margin-top: 2px; }
.claimed small { display: block; color: var(--muted); font-size: 12.5px; }

/* celebration */
.scrim { position: fixed; inset: 0; z-index: 50; background: var(--scrim); display: grid; place-items: center; padding: 16px; }
.celebrate { width: 100%; max-width: 420px; background: var(--surface); border-radius: 18px; padding: 28px 22px 18px; text-align: center; outline: none; border-top: 5px solid var(--gold); animation: pop .35s cubic-bezier(.2, 1.4, .4, 1); }
@keyframes pop { from { transform: scale(.85); opacity: 0; } }
.burst { position: relative; width: 96px; height: 96px; margin: 0 auto 10px; }
.burst-ic { position: absolute; inset: 14px; border-radius: 50%; background: var(--gold); color: #fff; display: grid; place-items: center; }
.burst i { position: absolute; left: 50%; top: 50%; width: 4px; height: 12px; margin: -6px 0 0 -2px; border-radius: 2px; background: var(--accent); transform: rotate(var(--a)) translateY(-52px); animation: ray .9s var(--d) ease-out both; }
.burst i:nth-child(odd) { background: var(--gold); }
@keyframes ray { from { transform: rotate(var(--a)) translateY(-30px); opacity: 0; } 60% { opacity: 1; } }
.celebrate h2 { font-size: 28px; font-weight: 700; letter-spacing: .04em; }
.cel-sub { color: var(--muted); margin-top: 4px; }
.cel-r { margin: 16px 0 18px; padding: 14px; border-radius: 12px; background: var(--gold-soft); font-size: 17px; font-weight: 500; line-height: 1.4; }
.cel-r > span:first-child { display: block; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--gold); margin-bottom: 4px; }
.cel-a { display: flex; flex-direction: column; gap: 4px; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 60; background: var(--navy); color: #fff; padding: 12px 18px; border-radius: 10px; font-size: 14.5px; font-weight: 500; max-width: calc(100% - 32px); box-shadow: 0 8px 24px rgba(0, 0, 0, .25); }
/* ---------- holidays, week table, reward kinds ---------- */
.hol-tag { display: inline-flex; align-items: center; gap: 6px; margin-top: 8px; padding: 4px 10px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); font-size: 13.5px; font-weight: 600; }
.banner { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 10px; background: var(--accent-soft); color: var(--ink); font-size: 14.5px; }
.banner svg { color: var(--accent); flex: none; margin-top: 3px; }
.wknav { display: flex; align-items: center; gap: 4px; padding: 6px; }
.wknav .back:disabled { opacity: .3; }
.wk-t { flex: 1; text-align: center; display: flex; flex-direction: column; } .wk-t span { font-size: 13px; color: var(--muted); }
.wk-sum { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 0 12px 12px; }
.wk-sum div { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; background: var(--surface-2); }
.wk-sum span { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.wk-sum b { font-size: 24px; font-weight: 600; } .wk-sum small { font-size: 12.5px; color: var(--muted); }
.wk-sum .won { border-color: var(--gold); background: var(--gold-soft); } .wk-sum .won small { color: var(--ink); font-weight: 600; }
.wtab { width: 100%; border-collapse: collapse; table-layout: fixed; }
.wtab th, .wtab td { border-top: 1px solid var(--line); padding: 10px 8px; text-align: left; vertical-align: middle; }
.wtab thead th { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding-block: 8px; }
.wtab th:first-child { padding-left: 16px; width: 36%; } .wtab td:last-child, .wtab th:last-child { padding-right: 12px; }
.wtab tbody th { font-weight: 400; } .wtab tbody th b { font-weight: 600; } .wtab tbody th .mono { color: var(--muted); font-weight: 500; }
.wtab .hol { display: block; font-size: 12px; color: var(--accent); font-weight: 600; line-height: 1.3; margin-top: 2px; }
.wtab tr.is-today th b { color: var(--accent); }
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 12.5px; font-weight: 600; padding: 3px 8px; border-radius: 99px; background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); white-space: nowrap; }
.pill-ok { background: var(--ok); color: #fff; border-color: var(--ok); }
.pill-today { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
.pill-up { border-style: dashed; background: transparent; color: var(--faint); }
.pill-ex { background: transparent; border-color: transparent; color: var(--faint); font-weight: 500; }
.pill-open { color: var(--ink); }
.note { display: flex; flex-direction: column; gap: 8px; }
.note b { color: var(--ink); }
.rt { display: block; } .rf { display: block; font-size: 14px; color: var(--muted); font-weight: 400; margin-top: 6px; }
.reward-card .rf { color: var(--navy-muted); }
.rk-b { border-width: 3px; background: linear-gradient(var(--navy), var(--navy)); box-shadow: 0 0 0 4px color-mix(in srgb, var(--gold) 25%, transparent); }
.celebrate { max-height: calc(100% - 8px); overflow-y: auto; }
.celebrate.special { border-top-width: 8px; }
.cel-r { text-align: left; } .cel-r + .cel-r { margin-top: -8px; }
.cel-b { border: 2px solid var(--gold); }
/* ---------- habit schedules ---------- */
.hab li.na .hab-b { cursor: default; color: var(--faint); }
.hab li.na .hab-b:hover { background: none; }
.hab li.na .box { border-style: dashed; opacity: .6; }
.hab li.na .pill { margin-left: auto; }
.days-link { display: block; width: 100%; min-height: 50px; border-top: 1px solid var(--line); color: var(--accent); font-weight: 600; font-size: 14.5px; text-align: left; padding: 0 16px; }
.days-link:hover { background: var(--surface-2); }
.dlg { width: 100%; max-width: 480px; max-height: calc(100% - 8px); overflow-y: auto; background: var(--surface); border-radius: 16px; padding: 8px 16px 16px; outline: none; }
.dlg-h { display: flex; align-items: center; gap: 8px; } .dlg-h h2 { flex: 1; font-size: 18px; font-weight: 700; }
.dlg-p { font-size: 13.5px; color: var(--muted); margin: 2px 0 8px; } .dlg-p.warn { color: var(--warn); margin: 6px 0 0; }
.hd-list { list-style: none; margin: 0; padding: 0; }
.hd-list li { padding: 12px 0; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
.hd-n { font-weight: 600; }
.seg { display: flex; flex-wrap: wrap; gap: 2px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
.seg button { flex: 1; min-height: 42px; padding: 0 10px; border-radius: 8px; font-size: 14px; font-weight: 500; color: var(--muted); }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: 0 0 0 1px var(--line-2); font-weight: 600; }
.dpick { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.dpick button { min-height: 44px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--surface); font-weight: 600; font-size: 13.5px; color: var(--muted); }
.dpick button.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.dlg-done { width: 100%; margin-top: 8px; }
/* ---------- half-hour slots ---------- */
.row { min-height: 58px; }
.row.half { border-top-style: dotted; border-top-color: var(--line); }
.time { flex-direction: column; align-items: flex-start; justify-content: center; gap: 0; line-height: 1.2; width: 92px; padding-left: 14px; }
.time b { font-weight: 600; font-size: 14px; }
.time span { font-size: 12px; color: var(--muted); white-space: nowrap; }
